# ─── إعدادات مرنان — النموذج الفيزيائي ───
# كل المعاملات هنا تتحكم في سلوك المحرك الفيزيائي أثناء التوليد والتدريب.
# يمكن تعديلها دون تغيير الكود.

# ═══ تسريع كرت الشاشة — للاستخدام (التوليد) فقط، وليس التدريب ═══
gpu:
  enabled: false              # فعّل لاستخدام كرت الشاشة NVIDIA في التوليد
  dim: 9958                   # عدد الأبعاد المنقولة للكرت (الأساسي PHASE_DIM)

# ═══ فضاء الاندماج الهندسي وكليفورد ═══
semantic_fusion:
  method: "projection"       # جداء كليفورد الهندسي (بدل المتوسط الخطي الخاطئ)
  vowel_modulation: true     # تفعيل تعديل الحركات بنصف قيمة حرف المد
  regularize: true           # تفعيل الانتظام الهندسي لتفادي أصفار الرتب الدلالية



# ═══ معامل ألفا — خلط السياق في المتجه الطوري ═══
# كلما زاد alpha، زاد تأثير السياق المحيط على معنى الكلمة.
# القيمة الأصلية: 0.3 — نرفعها لـ 0.5 لدقة أعلى.
alpha: 0.5

# ═══ DCCF — حقل الاقتران الديناميكي السياقي (بديل self-attention) ═══
dccf:
  decay_rate: 0.5          # سرعة اضمحلال تأثير الكلمات البعيدة
  mass_threshold: 0.3       # عتبة التوافق الطوري الأدنى

# ═══ PotentialCascade — طبقة الهوي التراكمي ═══
cascade:
  enabled: true             # تفعيل الهوي التراكمي — يمنع الانفلات الدلالي
  lambda_cascade: 3.0       # شدة طبقة الهوي
  gamma: 2.0                # أس اضمحلال المسافة (2.0 ≈ جاذبية)
  delta: 0.3                # ثابت تجنب التفرد
  phase_lock_threshold: 0.65
  repulsion_strength: 2.5
  friction_decay: 0.3

# ═══ PhaseReinforcement — التعزيز الطوري الذاتي ═══
phase_reinforcement:
  learning_rate: 0.05       # سرعة التعلم الطوري
  decay: 0.01               # اضمحلال التعزيز

# ═══ PromptField — تعديل الطور بالأمر ═══
prompt_field:
  decay_rate: 0.1
  strength: 1.0

# ═══ عوامل التحكم بقوة الجاذبية ═══
gravity:
  semantic_factor: +0.2       # معامل قوة الجاذبية الطورية الدلالية (معكوس - تنافر دلالي)
  positional_factor: +2.5     # معامل قوة الجاذبية الموضعية النحوية

# ═══ التحكم بقوة مصفوفة الربط الدلالي K_sem ═══
# تتحكم في مدى تأثير K_sem على اختيار المرشحين والتوليد
# strength=1.0: تأثير كامل، strength=0.0: اختيار عشوائي
# temperature=1.0: طبيعي، <1: حاد/مركّز، >1: مسطّح/عشوائي
# threshold=0.0: لا حدود، threshold>0: تصفية المرشحين الضعفاء
k_sem:
  strength: 1.0              # قوة تأثير K_sem على اختيار المرشحين (0.0-1.0)
  temperature: 1.0           # حرارة K_sem — حدة التوزيع (0.1-5.0)
  threshold: 0.0             # الحد الأدنى لقيمة الربط لقبول المرشح (0.0-1.0)
  # ملاحظة: strength يُطبَّق على قيم K_sem قبل الفرز
  # temperature يُطبَّق كأس: K_sem_value^(1/temperature)

# ═══ EntropyGate — بوابة الإنتروبيا ═══
entropy:
  S_crit: 1.0               # العتبة الحرجة للإنتروبيا

# ═══ معاملات التوليد ═══
generation:
  beam_width: 5
  top_k: 500
  beta: 2.0                 # ثابت بولتزمان للتنشيط الطوري
  # seed: 42                # بذرة عشوائية — محذوفة عمداً لتوليد فريد كل مرة
  relaxation_enabled: true    # تفعيل توليد الاسترخاء الرنيني (تحسين متعدد الممرات)
  relaxation_passes: 3       # عدد ممرات الاسترخاء

# ═══ معايرة الرنين — ضبط ذاتي للأوزان ═══
calibration:
  lr: 0.02                   # معدل تعلم المعايرة
  min_samples: 50            # الحد الأدنى لعينات التدريب
  max_iterations: 10         # أقصى عدد جولات
  convergence: 0.001          # عتبة التقارب

# ═══ تطور المتجهات الطورية — تنظيم ذاتي ═══
phase_evolution:
  lr_cooc: 0.03              # معدل تعلم المزامنة الهيبيانية (كان 0.01)
  lr_contrast: 0.015         # معدل تعلم التباين (كان 0.005)
  lr_spectral: 0.02          # معدل تعلم الإزاحة الطيفية (كان 0.008)
  min_cooc: 2                # الحد الأدنى للتشارك (كان 3)
  max_shift: 0.25             # أقصى إزاحة للمتجه (كان 0.1)

# ═══ مشهد القصد — آبار جهد محتمل ═══
intent_landscape:
  adaptation_rate: 0.01      # معدل تكييف الآبار

# ═══ أثر التفاعل — حقل مستمر ═══
interaction_trace:
  decay_rate: 0.95          # معدل اضمحلال الحقل
  max_attractors: 50         # أقصى عدد مناطق الجذب
  learning_rate: 0.05       # معدل تعلم الحقل

# ═══ الذاكرة الهرمية — ضغط السياق ═══
hierarchical_memory:
  word_capacity: 100         # سعة مستوى الكلمة
  phrase_capacity: 40        # سعة مستوى العبارة
  paragraph_capacity: 15     # سعة مستوى الفقرة
  conversation_capacity: 5   # سعة مستوى المحادثة

# ═══ أوزان التسجيل — موجات فيزيائية ═══
# كل "وزن" هنا يمثل الآن سعة موجية (amplitude).
# المعادلة: Ψ_total = Σ amplitude_i * exp(i * phase_i)
# الاحتمال = |Ψ_total|²  (قاعدة بورن)
# لا يوجد weighted average — فقط تراكب موجي حقيقي.
scoring_weights:
  # ═══ الأساسية — إشارات موجية قوية ═══
  align: 5.0                # سعة موجة المحاذاة الطورية
  gravity: 5.0              # سعة موجة الجاذبية الدلالية
  prompt_align: 6.0         # سعة موجة التوافق مع المحفز (الأعلى)
  k_sem: 5.0                # سعة موجة الارتباط الدلالي
  carrier: 4.0              # سعة الموجة الحاملة
  resonant_chain: 4.0       # سعة موجة السلسلة الرنينية
  syntax: 4.0               # سعة موجة النحو
  diversity: 3.0            # سعة موجة التنوع
  dccf: 3.0                 # سعة موجة الاقتران السياقي
  causal_flow_align: 3.0    # سعة موجة التدفق السببي
  constraint_align: 3.0     # سعة موجة القيد
  kb_knowledge: 3.0         # سعة موجة المعرفة
  ppm: 2.5                  # سعة موجة التنبيه
  # ═══ ثانوية — مساعدة ═══
  oscillator: 1.5           # مذبذبات كوراموتو
  heterodyne: 1.5           # التغاير الترددي
  repulsion: 1.5            # التنافر
  causal: 2.0               # السببية
  dialogue: 2.0             # الحوار
  intent_align: 2.0         # توافق القصد
  associative_plan: 2.0     # الخطة الترابطية
  plan_fidelity: 2.0        # إخلاص الخطة
  architect: 1.5            # وعي المراحل (فتح/وسط/إغلاق)
  trajectory: 2.0           # توافق المسار مع المحفز
  context_tension: 2.0      # شد التماسك بين الطور المحلي ومرساة الجذر/السطح

# ═══ محرك التغاير الترددي (Heterodyne) ═══
heterodyne:
  bandwidth: 0.15            # عرض نطاق التطابق الترددي
  context_window: 8          # نافذة السياق للتحليل الترددي

# ═══ التدريب — بناء مصفوفات K ═══
training:
  window_sem: 10             # نافذة K_sem — موسّعة لطلاقة أفضل
  window_syn: 4              # نافذة K_syn — موسّعة لطلاقة أفضل
  window_dial: 2             # نافذة K_dialogue
  particle_weight: 0.15      # وزن الحروف النحوية في K
  spectral_half_window: 7    # نصف نافذة الذاكرة الطيفية
  causal_window: 5           # نافذة السببية

# ═══ الوضع الإبداعي (Creative Mode) ═══
creative:
  tau: 1.2                   # حرارة Boltzmann عالية (مزيد من التنوع)
  beam_width: 8              # شعاع أوسع للاستكشاف
  tunnel_prob: 0.05          # احتمال النفق الكمومي (قفز مجازي)
  perturbation: 0.15         # شدة الاضطراب الطوري
  quantum_capacity: 25       # سعة التراكب الكمومي

# ═══ V8: مصفوفة الكثافة الكمومية — بديل متوسط المتجهات ═══
density_matrix:
  decay_rate: 0.8             # سرعة اضمحلال الأهمية الموضعية

# ═══ V8: حقل التدفق السببي — استدلال منطقي مستمر ═══
causal_flow:
  strength: 1.0               # شدة تيار التدفق (γ)
  transitive_depth: 3         # عمق الاستدلال التعددي

# ═══ V8.8: تبريد محاكى (Simulated Annealing) ═══
annealing:
  tau_max: 2.5                # حرارة البدء — استكشاف عالٍ في البداية
  tau_min: 0.15               # حرارة النهاية — تبلور حتمي في النهاية
  tau_decay: 5.0              # ثابت الاضمحلال — كلما زاد، كان التبريد أبطأ

# ═══ V8.8: حقل قيود Dirichlet — prompt boundary conditions ═══
prompt_constraint:
  k_spring: 3.0               # ثابت النابض — قوة الربط بالعقدة المستهدفة
  damping: 0.15               # تخميد النابض مع البعد

# ═══ V8.8: ذاكرة هولوغرافية معرفية (Holographic KB) ═══
holographic_kb:
  enabled: true               # تفعيل الذاكرة الهولوغرافية
  max_facts: 500              # أقصى عدد حقائق للتخزين
  curated_path: "data/facts_expanded.json"  # مسار ملف الحقائق المنسقة

# ═══ V8.8: مسبب تكامل مساري (Path Integral Reasoner) ═══
goal_gravity_weight: 0.3     # وزن جاذبية الهدف (λ) — 0.3 معتدل، 0.5 قوي، 0.1 ضعيف

kb_influence: 0.4            # وزن تأثير القاعدة المعرفية في التوليد العادي (0-1)

reasoning:
  beam_width: 10              # عرض شعاع الاستدلال
  max_depth: 8                # أقصى عمق استدلالي
  min_depth: 2                # أدنى عدد خطوات قبل التحقق من التقارب
  convergence_threshold: 0.75 # عتبة تشابه الهدف للتقارب

# ═══ التداخل الطوري الهدام للأكواد والتعليقات ═══
destructive_phase:
  enabled: true
  system_words:
    - "الملف"
    - "بنجاح"
    - "النافذة"
    - "النافذه"
    - "اغلاق"
    - "إغلاق"
    - "ايقاف"
    - "إيقاف"
    - "توليد"
    - "التوليد"
    - "فيزيائي"
    - "الفيزيائي"
    - "مرنان"
    - "الرنين"
    - "رنين"
    - "اتحدث"
    - "تتحدثها"
    - "اللغات"
    - "بطلاقة"
    - "بطلاقه"
    - "الاجابه"
    - "استطيع"
    - "تثبيت"
    - "تعديل"
    - "احفظ"
    - "تم"
    - "حفظك"

