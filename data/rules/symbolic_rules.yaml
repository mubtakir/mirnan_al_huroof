rules:
  - name: "rule_negation"
    description: "النفي: لا، لم، لن، ما، ليس -> جذب كلمات النفي، طرد كلمات الإثبات"
    lookback: 2
    markers: ["لا", "لم", "لن", "ما", "ليس", "لستم", "لست", "ليست", "لستما", "غير", "دون", "بدون", "عدم"]
    targets: ["نفي", "انكار", "جحد", "ضد", "عكس", "رفض", "انتفاء", "خلو", "بلا"]
    score: 0.3
    anti_targets: ["نعم", "اجل", "بلى", "صحيح", "حق", "بكل", "قطعا", "حتما"]
    anti_score: -0.7

  - name: "rule_conjunction"
    description: "العطف والربط: و، ف، ثم -> جذب للكلمة التالية"
    lookback: 1
    markers: ["و", "ف", "ثم", "أو", "أم", "بل", "لكن", "لا"]
    score: 0.05

  - name: "rule_comparative"
    description: "التفضيل: أكثر، أفضل -> جذب لحرف المقارنة من"
    lookback: 2
    markers: ["أكثر", "أقل", "أفضل", "أكبر", "أصغر", "أعلى", "أدنى", "أطول", "أقصر", "أعظم", "أحسن", "أردأ", "أشد", "أقوى", "أضعف"]
    targets: ["من"]
    score: 0.1

  - name: "rule_interrogative"
    description: "الاستفهام: هل، ماذا، أين -> جذب كلمات الجواب"
    lookback: 1
    markers: ["هل", "أ", "ماذا", "متى", "أين", "كيف", "لماذا", "من", "كم", "ما", "أي", "أيان", "أنى"]
    targets: ["لأن", "بسبب", "حيث", "عند", "هو", "هي", "هم", "لان", "اذ", "نظرا", "بما", "كونه"]
    score: 0.15

  - name: "rule_conditional_1"
    description: "الشرط: إذا، لو، إن -> جذب للجواب"
    lookback: 2
    markers: ["إذا", "لو", "إن", "لولا", "كلما", "متى", "اذا", "ان", "ما", "من", "مهما"]
    targets: ["فإن", "ف", "ل", "سوف", "فسوف", "س", "فسيكون", "كان", "يكون", "فكذلك"]
    score: 0.2

  - name: "rule_conditional_2"
    description: "الشرط الممتد"
    lookback: 2
    markers: ["إذا", "لو", "إن", "لولا", "كلما", "متى", "اذا", "ان", "ما", "من", "مهما"]
    score: 0.05

  - name: "rule_emphasis_assertion"
    description: "التوكيد والتقرير"
    lookback: 2
    markers: ["إن", "إنّ", "إنه", "لقد", "قد", "حقاً", "فعلاً", "قطعاً", "يقيناً", "بالتأكيد", "بلا", "شك", "لا", "ريب"]
    targets: ["هو", "هي", "هم", "ذلك", "هذا", "كذلك", "الامر", "الحق", "الصواب", "الواقع", "الحقيقة"]
    score: 0.12

  - name: "rule_contrast_antithesis"
    description: "الطباق والتضاد: بل، غير أن، لكن"
    lookback: 2
    markers: ["بل", "لكن", "لكنه", "لكنها", "غير", "إلا", "سوى", "عكس", "نقيض", "ضد", "خلاف", "بينما", "حين", "في حين"]
    score: 0.15

  - name: "rule_exclamation_marvel"
    description: "التعجب والاستحسان"
    lookback: 2
    markers: ["ما", "يا", "له", "لها", "لهم", "كم", "رب", "ربما", "رُبَّ"]
    targets: ["أجمل", "أعظم", "أبدع", "أروع", "أكبر", "أقبح", "أشد", "أحسن", "أفضل", "أسوأ", "أحقر", "أسمى"]
    score: 0.25
    anti_targets: []
    anti_score: 0.0

  - name: "rule_sarcasm_irony"
    description: "السخرية والتهكم"
    lookback: 4
    markers: ["فشل", "خسارة", "كارثة", "فضيحة", "بلاء", "ضعف", "جهل", "حماقة", "سخافة", "أهنئك", "أبارك", "مبروك", "تبارك", "ليت", "يا له", "عجبا", "عجباً"]
    targets: ["نجاح", "فوز", "تميز", "إبداع", "رائع", "ممتاز", "بارع", "عبقري"]
    score: 0.3

  - name: "rule_logical_cause"
    description: "التعليل والسببية (السبب)"
    lookback: 2
    markers: ["لأن", "لان", "إذ", "اذ", "حيث", "بما", "نظرا", "بسبب", "جراء", "من أجل", "لأجل", "علة", "سبب"]
    score: 0.15

  - name: "rule_logical_effect"
    description: "التعليل والسببية (النتيجة)"
    lookback: 2
    markers: ["لذلك", "لذا", "ولذلك", "إذن", "اذن", "وبالتالي", "فبالتالي", "فمن", "ومن", "نتيجة", "ثمرة", "عاقبة", "مآل"]
    score: 0.12

  - name: "rule_concession_exception"
    description: "الاستدراك والاستثناء"
    lookback: 3
    markers: ["لا", "سيما", "إلا", "الا", "غير", "سوى", "خصوصاً", "تحديداً", "بالأخص", "لاسيما", "بخاصة"]
    targets: ["أن", "انه", "ان", "ما", "من", "في", "على"]
    score: 0.18

  - name: "rule_gradation_escalation"
    description: "التدرج والتصاعد"
    lookback: 2
    markers: ["بل", "بله", "فضلا", "عن", "فحسب", "وحسب", "وكفى", "بكثير", "وأكثر", "وأشد", "ناهيك", "دعك"]
    score: 0.12

  - name: "rule_rhetorical_question"
    description: "الاستفهام الإنكاري والبلاغي"
    lookback: 2
    markers: ["أليس", "أفلا", "أوليس", "ألا", "ألم", "أوما", "أتصدق", "كيف", "أين", "أبعد", "أمن"]
    targets: ["بلى", "نعم", "لا", "قطعا", "يقينا", "حتما", "أبداً", "قط", "مستحيل"]
    score: 0.25

  - name: "rule_summary_conclusion"
    description: "الخاتمة والتلخيص"
    lookback: 2
    markers: ["ختاما", "ختاماً", "وهكذا", "خلاصة", "وخلاصة", "وفي", "وبهذا", "ومما", "وكخلاصة", "إجمالا", "باختصار", "وباختصار", "إذن", "وإذن", "ولذا", "ولذلك", "وعليه", "وبناء", "تبعاً"]
    score: 0.15

  - name: "rule_supplication_invocation"
    description: "الدعاء والتضرع"
    lookback: 2
    markers: ["والله", "لولا", "سبحان", "الحمد", "لله", "بسم", "إن", "ان", "رب", "ربنا", "اللهم", "حسبنا", "نعم", "النعم", "الوكيل", "الرحمن", "الرحيم"]
    targets: ["العظيم", "الحكيم", "الكريم", "العليم", "القدير", "الرحيم", "الخالق", "الرازق", "المدبر"]
    score: 0.3

  - name: "rule_opposition_refutation"
    description: "التفنيد والرد"
    lookback: 3
    markers: ["خطا", "خطأ", "فاسد", "مردود", "مرفوض", "باطل", "ضعيف", "واه", "لا يصح", "مغالطة", "مصادرة", "مبالغة", "تعميم", "متسرع", "انتقد", "فند", "رد", "نقض", "دحض", "ابطل"]
    targets: ["الدليل", "الحجة", "البرهان", "المنطق", "القياس", "المقدمة", "النتيجة", "الاستنتاج", "الاستدلال"]
    score: 0.2

  - name: "rule_comparision_contrast"
    description: "المقارنة والموازنة"
    lookback: 3
    markers: ["شتان", "بون", "الفرق", "فرق", "ليس", "لا", "بين", "كم", "كيف"]
    score: 0.12

  - name: "rule_apology_excuse"
    description: "الاعتذار والاستعذار"
    lookback: 3
    markers: ["معذرة", "عذرا", "عذراً", "أعتذر", "اعتذر", "ما", "لم", "لست", "تقصيري", "هفوتي", "زلتي"]
    targets: ["اعفني", "اعف", "صفح", "تجاوز", "سامح", "اغفر", "اقبل", "قبول", "عفو", "مغفرة"]
    score: 0.25

  - name: "rule_address_audience"
    description: "مخاطبة الجمهور"
    lookback: 2
    markers: ["إياكم", "إياك", "لا", "يفتكم", "خذوا", "احذروا", "انتبهوا", "تنبهوا", "تذكروا", "اعلموا", "فاعلموا", "اعلم", "فاعلم", "تنبه", "انظر", "ارقب", "راقب"]
    targets: ["خطر", "تحذير", "عاقبة", "مصير", "وخيم", "سيئ", "ضرر", "فساد", "خطيئة", "وبال"]
    score: 0.22

  - name: "rule_internal_monologue"
    description: "الحديث الداخلي والتساؤل"
    lookback: 3
    markers: ["طالما", "كثيرا", "لطالما", "دائما", "أحياناً", "ربما", "قد", "يخالجني", "يساورني", "أتساءل", "أتعجب"]
    targets: ["سؤال", "تساؤل", "تأمل", "فكرة", "خاطر", "هاجس", "وهم", "حلم", "رؤية", "تصور"]
    score: 0.18

  - name: "rule_calc_context"
    description: "سياق حسابي"
    lookback: 3
    markers: ["ناتج", "مجموع", "حاصل", "يساوي", "نتيجة", "قيمة", "calculate", "result", "equals", "sum", "total"]
    score: 0.12

  - name: "rule_code_debug"
    description: "سياق برمجي"
    lookback: 3
    markers: ["خطأ", "خطا", "مشكلة", "عطل", "bug", "error", "فشل", "exception", "لماذا", "سبب", "تحذير", "warning", "issue", "problem"]
    targets: ["لأن", "بسبب", "حيث", "عند", "لان", "اذ", "نظراً", "بما", "كون", "should", "must", "needs", "requires", "بدلاً", "الحل", "تصحيح"]
    score: 0.2

  - name: "rule_variable_name"
    description: "أسماء متغيرات برمجية"
    lookback: 3
    markers: ["var", "let", "const", "def", "int", "float", "str", "list", "array", "dict", "function", "class", "if", "for", "while", "return", "import", "from", "print", "range", "len"]
    score: 0.08
